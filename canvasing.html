<html>
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <style>
            body {
                margin: 0;
                padding: 0;
                overflow-x: auto; /* Ensure horizontal scrolling */
            }
            .container {
                display: flex;
                flex-wrap: nowrap; /* Prevent wrapping on desktop */
                gap: 30px;
                justify-content: flex-start; /* Align items to the left */
                padding: 40px;
            }
            [class^="box-"] {
                height: 250px;
                width: 250px;
                background-color: #bdbdbd;
                flex-shrink: 0;
                display: flex;
            }
            .button {
                margin: auto;
                padding: 5px 10px;
                border-radius: 10px;
            }
            /* Tablet responsiveness */
            @media (min-width: 510px) and (max-width: 1024px) {
                .container {
                    flex-wrap: wrap; /* Enable wrapping for smaller devices */
                    width: auto; /* Adjust width dynamically */
                }
                /* .box {
                    width: 40%;
                } */
                [class^="box-"] {
                    width: 40%;
                }
            }
            /* Mobile responsiveness */
            @media only screen and (max-width: 550px) {
                .container {
                    flex-wrap: wrap; /* Enable wrapping */
                    width: auto; /* Adjust width dynamically */
                    gap:40px
                }
                /* .box {
                    width: 100%;
                } */
                [class^="box-"] {
                    width: 100%;
                }
            }
        </style>
        <script>
            const borderColors = [
                "#FFB3BA", // Light Pink
                "#B9FBC3", // Pastel Green
                "#B3E5FC", // Soft Blue
                "#FFCCE5", // Pale Pink
                "#FFF9C4", // Light Yellow
                "#D1C4E9", // Lavender
                "#B2EBF2", // Soft Teal
                "#FFE0B2", // Pale Orange
                "#FFCDD2", // Soft Red
                "#BBDEFB"  // Light Sky Blue
            ];
            function createRowDiv(i) {
                var containerDiv = document.createElement('div');
                containerDiv.setAttribute('class','container');
                containerDiv.setAttribute('id',`main-div-${i}`);
                document.body.appendChild(containerDiv);
            }
            function createDivAndButtonInaRow(i,j) {
                    var color = borderColors[Math.ceil(Math.random() * 10)];
                    var mainDiv = document.getElementById(`main-div-${i}`);
                    var div = document.createElement('div');
                    div.setAttribute('class', `box-${i}-${j}`);
                    div.setAttribute('style',`background-color:${color}`)
                    var buttonElement = document.createElement("button");
                    buttonElement.setAttribute('class','button');
                    buttonElement.setAttribute('id',`button-${i}-${j}`);
                    buttonElement.textContent ='Click Me';
                    div.appendChild(buttonElement);
                    mainDiv.appendChild(div);
            }
            function onLoadFn() {
                for(var i=1; i<=130; i++) {
                    createRowDiv(i);
                    for ( var j=1; j<=11; j++) {
                        createDivAndButtonInaRow(i,j)
                    }
                }
            }
            window.onload = onLoadFn; 
        </script>
    </head>
    <body>
    </body>
</html>
